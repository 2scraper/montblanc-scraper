name: Site changed / selectors broke
description: Montblanc changed something and the parser no longer matches.
labels: ["site-change"]
body:
  - type: markdown
    attributes:
      value: |
        This is the most common way a scraper stops working, and it is worth its
        own report because the fix is different from a code bug: something on
        montblanc.com moved.

        Useful to know before filing: the parser reads the page's **JSON-LD
        first** (`ItemList` on a listing, `ProductGroup` on a product page),
        enriched from the tiles' own attributes, then a URL-pattern fallback.
        Which one broke narrows the fix a lot.

  - type: dropdown
    id: what_broke
    attributes:
      label: What stopped matching
      options:
        - Products (0 rows on a page that visibly has products)
        - A specific field is null or wrong (price, sku, image, URL)
        - in_stock, collection or color empty out (the tile attributes)
        - --mode product returns no variants
        - Pagination stops early or repeats a page
        - The captcha detector finds nothing on a page that has one
        - Something else
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: URL
      description: The exact listing URL, and the country your exit IP was in.
      placeholder: "https://www.montblanc.com/en-us/writing-instruments (exit IP: FI datacenter, local Chromium)"
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence from the page
      description: |
        Whichever of these you can get. A capture beats a description.

        - JSON-LD as the page actually serves it:
          `python3 -c "import json,sys,re;h=open('dump.html').read();print([m[:400] for m in re.findall(r'<script type=\"application/ld\\+json\">(.*?)</script>',h,re.S)][:2])"`
        - Or open devtools and paste one `Product` node from the `ItemList`
          (or the `ProductGroup` on a product page).
        - For a field problem: the value you got, and the value on the page.
      render: text
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: >-
        Whether it reproduces on a second engine, whether it reproduces from a
        different country, and when it last worked.
