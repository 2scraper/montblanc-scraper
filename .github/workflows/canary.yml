# One real run against montblanc.com. tests.yml (deliberately) never touches
# the site — see its own header.
#
# THIS CANARY NEEDS NO CREDENTIALS, and that is the whole point of it.
#
# The README's central claim is that you do not need a 2Captcha account to
# scrape this site: measured 2026-09-17 from a datacenter address, listings,
# search and product pages all answered HTTP 200 with no key, no proxy and no
# challenge of any kind. A GitHub runner is a datacenter address too, so this
# workflow re-measures that claim every morning.
#
# CLAUDE.md §11 says a canary that CANNOT pass must skip rather than fail,
# because a check that is always red teaches everyone to ignore checks. The
# other half of that rule applies here: **a canary that CAN pass without a
# credential must never be gated on one**. If Montblanc ever puts its
# catalogue behind a key or a bot manager, this badge goes red the next
# morning and the README's claim is retested without anyone remembering to.
#
# The third job is the exception, and it is guarded: it exercises the PAID
# path (the Scraping Browser API over CDP), which cannot run without a
# secret, so it skips with a ::notice:: when none is set.
#
#     gh secret set MONTBLANC_CDP_ENDPOINT --repo 2scraper/montblanc-scraper
#
# `secrets` is not available in a job-level `if`, so presence is tested
# through job `env` and read in each step's `if`.

name: canary

on:
  schedule:
    # 05:40 UTC. Not on the hour: every scheduled workflow on GitHub fires at
    # :00 and the queue there is long.
    - cron: "40 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  # A top-level category with ~280 products, so three pages really is three
  # pages. §11: with one page pagination is never exercised, which is exactly
  # how a silent single-page bug survived in a sibling repo.
  CANARY_URL: "https://www.montblanc.com/en-us/writing-instruments"

jobs:
  listing:
    name: listing (no credentials needed)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-playwright.txt
          playwright install --with-deps chromium

      - name: Run
        id: run
        run: |
          set +e   # GitHub runs `run:` under `bash -e`, and a non-zero exit
                   # would abort the step BEFORE the echo below.
          python playwright_scraper.py \
            --url "$CANARY_URL" \
            --sort price-asc --pages 3 --format both --out canary
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Check what came back
        run: |
          python - <<'PY'
          import json, os, sys

          code = int(os.environ["EXIT_CODE"])
          if code != 0:
              print(f"::error::The run exited {code}.")
              # Interpret it rather than just failing: the codes mean
              # different things and only some of them are this repo's fault.
              print({
                  3: "Blocked (exit 3). Montblanc refused a GitHub runner's "
                     "address, which has never happened in testing. If this "
                     "is real, the site started gating its catalogue and the "
                     "README's central claim — that no key is needed — needs "
                     "re-measuring TODAY.",
                  4: "Zero products (exit 4). Either the category is empty "
                     "now, or the page shape moved and the parser is reading "
                     "nothing. Check the uploaded HTML dump.",
                  5: "Remote API error (exit 5) — nothing was tested.",
                  6: "Partial (exit 6): some pages came back and some did not.",
              }.get(code, "See the log."))
              sys.exit(1)

          meta = json.load(open("canary.meta.json"))
          rows = json.load(open("canary.json"))
          print(json.dumps(meta, indent=1))

          failures = []
          def want(label, ok, detail):
              if not ok:
                  failures.append(f"{label}: {detail}")

          # §20: fail on a parser failure BY NAME. "0 products" would send
          # whoever reads this red badge to check the URL, when the thing
          # that moved is the parser. This stop_reason means Montblanc served
          # a page that links to products and we turned it into nothing.
          want("not a parser failure",
               meta.get("stop_reason") != "parser_found_nothing",
               "Montblanc served a page linking to products and the parser "
               "produced ZERO rows — check the JSON-LD (a renamed or dropped "
               "ItemList) before checking the URL")

          want("status", meta["status"] == "complete", meta["status"])
          want("pages_completed", meta["pages_completed"] == 3,
               f'{meta["pages_completed"]} of 3')
          want("no failed pages", not meta["pages_failed"],
               str(meta["pages_failed"]))

          # 24 per page x 3 pages = 72, less whatever the site repeats across
          # a page boundary (measured: 0-2 on this category). The floor sits
          # well below that so a legitimately reshuffled page cannot trip it.
          want("row floor", len(rows) >= 60, f"{len(rows)} rows")

          # The site's own arithmetic, which is what pages are planned from.
          # If this stops being read, pagination silently falls back to
          # walking off the end.
          want("the site stated a result count",
               isinstance(meta.get("total_results"), int)
               and meta["total_results"] > 100,
               f'total_results was {meta.get("total_results")!r}')
          want("pages_available follows from it",
               meta.get("pages_available") and meta["pages_available"] >= 3,
               f'pages_available was {meta.get("pages_available")!r}')

          # The market a price belongs to. A file of prices without it is a
          # file of numbers without units, because Montblanc SETS prices per
          # market rather than converting them.
          want("locale recorded", meta.get("locale") == "en-us",
               f'locale was {meta.get("locale")!r}')
          want("every row carries its market",
               all(r.get("locale") == "en-us" for r in rows),
               "a row is missing its locale")

          # The ordering decides WHICH products are in the file. The site
          # never reports which one it applied (it publishes only the
          # category default), so what is checkable is that the run asked for
          # the one we think it did.
          want("sort requested", meta.get("sort_requested") == "price-asc",
               f'sort_requested was {meta.get("sort_requested")!r}')
          want("every row records the ordering",
               all(r.get("sort") == "price-asc" for r in rows),
               "a row is missing its sort")

          # Coverage, on the columns measured at 100% over 192 real rows.
          for column in ("title", "url", "sku", "currency"):
              filled = sum(1 for r in rows if r.get(column) not in (None, "", []))
              share = 100.0 * filled / len(rows)
              print(f"{column}: {filled}/{len(rows)} ({share:.0f}%)")
              want(f"{column} coverage", share >= 99, f"{share:.0f}%")

          # Price is checked separately and a little lower, because the
          # JSON-LD genuinely omits it for range-priced variant groups and
          # the DOM read recovers those. A real shortfall here is a parsing
          # break, not the site's variety.
          priced = sum(1 for r in rows if r.get("price") is not None)
          share = 100.0 * priced / len(rows)
          print(f"price: {priced}/{len(rows)} ({share:.0f}%)")
          want("price coverage", share >= 95, f"{share:.0f}%")

          # A price with no currency is a number with no units.
          want("no price without a currency",
               not any(r.get("price") is not None and not r.get("currency")
                       for r in rows),
               "a priced row has no currency")

          # A 'From' range is a MINIMUM over a variant group, not a price.
          # It must stay distinguishable, or a consumer averages it in.
          sources = {r.get("price_source") for r in rows if r.get("price") is not None}
          print(f"price_source values: {sorted(s for s in sources if s)}")
          want("price_source is always recorded", None not in sources,
               "a priced row has no price_source")
          want("price_source uses only known values",
               sources <= {"jsonld", "dom", "dom_range"}, str(sources))

          # in_stock must not be a constant. The JSON-LD says InStock on
          # everything; the tile is what varies, and if this ever comes back
          # single-valued the read has silently fallen back to the JSON-LD.
          stock = {r.get("in_stock") for r in rows}
          print(f"in_stock values: {stock}")
          want("in_stock is not constant-True",
               stock != {True},
               "every row is in stock — that is the JSON-LD default, so the "
               "tile read has probably broken (see output_writer's docstring)")

          # page+position must be unique across pages, or the column is
          # worthless — position restarts at 1 on every page.
          pairs = [(r["page"], r["position"]) for r in rows]
          want("page+position unique", len(set(pairs)) == len(pairs),
               f"{len(pairs) - len(set(pairs))} collisions")
          want("sku unique", len({r["sku"] for r in rows}) == len(rows),
               "duplicate skus")

          print(f"Montblanc reports {meta.get('total_results')} products "
                f"across {meta.get('pages_available')} pages; this run holds "
                f"{len(rows)}.")

          if failures:
              for line in failures:
                  print(f"::error::{line}")
              sys.exit(1)
          print("All canary assertions passed.")
          PY
        env:
          EXIT_CODE: ${{ steps.run.outputs.exit_code }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canary-listing
          path: |
            canary.json
            canary.csv
            canary.meta.json
            canary_page*_debug.html
          if-no-files-found: ignore

  product:
    name: product variants (no credentials needed)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-playwright.txt
          playwright install --with-deps chromium

      # A product page is a different page kind with a different structured
      # type (`ProductGroup`, not `ItemList`), so the listing canary passing
      # says nothing about it. It needs no credentials either.
      - name: Run
        id: run
        run: |
          set +e
          python playwright_scraper.py --mode product \
            --url "https://www.montblanc.com/en-us/meisterstuck-gold-coated-legrand-fountain-pen-MB132460.html" \
            --format json --out canary_product
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Check what came back
        run: |
          python - <<'PY'
          import json, os, sys
          code = int(os.environ["EXIT_CODE"])
          if code != 0:
              print(f"::error::The product run exited {code}. Exit 4 here "
                    f"usually means the page stopped publishing ProductGroup, "
                    f"or that product was discontinued — check the dump "
                    f"before assuming the parser broke.")
              sys.exit(1)

          rows = json.load(open("canary_product.json"))
          meta = json.load(open("canary_product.meta.json"))
          print(json.dumps(meta, indent=1))

          failures = []
          def want(label, ok, detail):
              if not ok:
                  failures.append(f"{label}: {detail}")

          # ONE ROW PER VARIANT is the whole reason this mode exists. A single
          # row back means the parser read the group and dropped hasVariant.
          want("more than one variant", len(rows) > 1, f"{len(rows)} rows")
          want("variants have distinct skus",
               len({r["sku"] for r in rows}) == len(rows), "duplicate skus")
          # Each variant's own URL, not the group's — the offers.url trap.
          want("variants have distinct urls",
               len({r["url"] for r in rows}) == len(rows),
               "every variant points at the same page: offers.url is being "
               "read instead of the variant's own url")
          want("every row names its group",
               all(r.get("variant_of") for r in rows), "a row has no variant_of")
          want("every variant is priced",
               all(r.get("price") is not None for r in rows), "a variant has no price")
          want("mode recorded", meta.get("mode") == "product", meta.get("mode"))

          print(f"{len(rows)} variants, sizes: "
                f"{sorted({r.get('size') for r in rows if r.get('size')})}")
          if failures:
              for line in failures:
                  print(f"::error::{line}")
              sys.exit(1)
          print("All product-mode assertions passed.")
          PY
        env:
          EXIT_CODE: ${{ steps.run.outputs.exit_code }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canary-product
          path: |
            canary_product.json
            canary_product.meta.json
          if-no-files-found: ignore

  scraping-browser:
    name: Scraping Browser API (needs a secret)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # `secrets` is not available in a job-level `if`, so presence is tested
      # through job `env` and read in each step's `if`.
      HAVE_CDP: ${{ secrets.MONTBLANC_CDP_ENDPOINT != '' }}
    steps:
      - name: Explain the skip
        if: env.HAVE_CDP != 'true'
        run: |
          echo "::notice::Skipping the Scraping Browser run: no MONTBLANC_CDP_ENDPOINT secret is set."
          echo "This job exercises the PAID path — the one that has no free"
          echo "equivalent to fall back on, and therefore the one §16 says to"
          echo "run before shipping, because credential-gated paths are the"
          echo "paths nobody ran."
          echo
          echo "    gh secret set MONTBLANC_CDP_ENDPOINT --repo 2scraper/montblanc-scraper"
          echo
          echo "Note the listing and product canaries above need NO secret and"
          echo "cover the parser end to end. Nothing is untested because this"
          echo "job skipped — only the CDP transport is."
          echo
          echo "Scraping Browser profile credentials expire in about a day, so"
          echo "a scheduled job on this secret will rot between runs. Prefer"
          echo "dispatching this workflow by hand when you want to check it."

      - uses: actions/checkout@v4
        if: env.HAVE_CDP == 'true'
      - uses: actions/setup-python@v5
        if: env.HAVE_CDP == 'true'
        with:
          python-version: "3.12"

      - name: Install
        if: env.HAVE_CDP == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-playwright.txt

      # The credential goes through the ENVIRONMENT, never a --proxy/--cdp
      # flag on a command line (§3, §11): env_config.py already reads exactly
      # this variable, and a secret in argv is readable by anything that can
      # run `ps`.
      - name: Run
        if: env.HAVE_CDP == 'true'
        id: run
        env:
          MONTBLANC_CDP_ENDPOINT: ${{ secrets.MONTBLANC_CDP_ENDPOINT }}
        run: |
          set +e
          python playwright_scraper.py \
            --url "$CANARY_URL" --pages 1 --format json --out canary_cdp
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Check what came back
        if: env.HAVE_CDP == 'true'
        env:
          EXIT_CODE: ${{ steps.run.outputs.exit_code }}
        run: |
          python - <<'PY'
          import json, os, sys
          code = int(os.environ["EXIT_CODE"])
          if code != 0:
              print(f"::error::The Scraping Browser run exited {code}. "
                    f"Exit 5 means the endpoint itself refused — a "
                    f"profile_locked (another run holds this pid) or expired "
                    f"credentials, not a fault in this code.")
              sys.exit(1)
          rows = json.load(open("canary_cdp.json"))
          if len(rows) < 20:
              print(f"::error::only {len(rows)} rows over CDP")
              sys.exit(1)
          # The marker check that matters on this path: 2Captcha's auto-solve
          # extension injects `cf-turnstile` into every page it loads, and a
          # repo that carried that marker would report this good page as
          # blocked (§8, §19). This repo does not carry it — exit 0 here is
          # the proof, since a false positive would have been exit 3.
          print(f"{len(rows)} rows over the Scraping Browser, exit 0.")
          PY

      - uses: actions/upload-artifact@v4
        if: always() && env.HAVE_CDP == 'true'
        with:
          name: canary-cdp
          path: |
            canary_cdp.json
            canary_cdp.meta.json
          if-no-files-found: ignore
